<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>分层长程记忆 UI Harness</title>
    <link rel="stylesheet" href="../style-v0.11.0.css"/>
    <style>
        :root {
            --SmartThemeBlurTintColor: #15171f;
            --SmartThemeBodyColor: #ecebf1;
            --SmartThemeBorderColor: #5b5d6a;
            --SmartThemeQuoteColor: #b0a7ff;
            --mainFontFamily: "Avenir Next", "PingFang SC", sans-serif;
        }
        body { min-height: 100vh; margin: 0; color: var(--SmartThemeBodyColor); background: #10121a; font-family: var(--mainFontFamily); }
        #top-settings-holder { position: fixed; top: 0; right: 0; left: 0; display: flex; z-index: 20; }
        #top-bar { display: flex; gap: 8px; align-items: center; width: 100%; height: 44px; padding: 0 14px; background: #1b1d27; }
        #top-bar button { width: 32px; height: 32px; color: inherit; background: #292c38; border: 1px solid #464957; border-radius: 7px; }
        #extensionsMenu { display: none; }
        #extensions_settings { width: 320px; margin: 32px; }
        #hostile-mobile-controls { display: none; }
        body.simulate-stale-layout .layered-memory-root {
            right: 32px;
            left: auto;
            margin-inline: 0;
            transform-origin: top right;
        }
        @media (max-width: 599px) {
            #top-settings-holder { display: none; }
            #extensions_settings { display: none; }
            #hostile-mobile-controls {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 999999;
                display: flex;
                gap: 6px;
            }
            #hostile-mobile-controls button {
                width: 46px;
                height: 46px;
                color: white;
                background: #5d6675;
                border: 0;
            }
        }
    </style>
</head>
<body>
    <div id="top-settings-holder"><div id="top-bar"><button id="extensions-settings-button" type="button">E</button></div></div>
    <div id="extensionsMenu"></div>
    <div id="extensions_settings"></div>
    <div id="hostile-mobile-controls" aria-label="模拟酒馆手机浮动控件">
        <button type="button">菜单</button>
        <button type="button">阅读</button>
    </div>
    <script type="module">
        const now = Date.now();
        const harnessMode = new URLSearchParams(location.search).get('mode') || 'complete';
        if (harnessMode === 'stale-css') document.body.classList.add('simulate-stale-layout');
        const chatPairCount = ['grown', 'empty-draft'].includes(harnessMode) ? 300 : 132;
        const recordedPairCount = harnessMode === 'grown' ? 132 : harnessMode === 'empty-draft' ? 140 : chatPairCount;
        const chat = [];
        for (let i = 0; i < chatPairCount; i += 1) {
            chat.push({ is_user: true, mes: `用户消息 ${i}`, send_date: `${i}-u`, extra: { layered_memory_id: `${i}-u` } });
            chat.push({ is_user: false, mes: `AI 回复 ${i}`, send_date: `${i}-a`, extra: { layered_memory_id: `${i}-a` } });
        }
        const entries = [
            { id: 'e_1', slot: 'body', subject: '林晚', object: '', value: '左臂受伤，暂时无法用力', cause: '到达北港前需要重新包扎', updated_floor: 126, evidence: '林晚护着受伤的左臂，指尖微微发抖。', pinned: true },
            { id: 'e_2', slot: 'promise', subject: '周衡', object: '林晚', value: '答应护送林晚到北港', cause: '争执后仍在履行', updated_floor: 124, evidence: '我会把你送到北港。', pinned: false },
            { id: 'e_3', slot: 'relationship', subject: '林晚', object: '周衡', value: '恢复合作，但尚未完全和解', cause: '合作继续，信任仍需修复', updated_floor: 123, evidence: '这不代表我已经原谅你。', pinned: false },
            { id: 'e_4', slot: 'possession', subject: '林晚', object: '', value: '保管刻有鸦纹的铜钥匙', cause: '', updated_floor: 118, evidence: '她收起那枚刻着鸦纹的铜钥匙。', pinned: false },
            { id: 'e_5', slot: 'identity', subject: '<user>', object: '', value: '是诡秘之神', cause: '', updated_floor: 92, evidence: '你就是诡秘之神。', pinned: false, source: 'auto' },
        ];
        const extracted = chat.filter(x => !x.is_user).slice(0, recordedPairCount).map((_, i) => `${i}-u+${i}-a`);
        const turnSummaries = Array.from({ length: recordedPairCount }, (_, pairIndex) => ({
            floorKey: `${pairIndex}-u+${pairIndex}-a`,
            pairIndex,
            contentFingerprint: `fp-${pairIndex}`,
            summary: `<user>推进第 ${pairIndex} 轮对话，林许作出回应，双方留下后续事项。`,
            ...(pairIndex === 0 ? { story_time: { label: '次日清晨', evidence: '次日清晨', kind: 'relative' } } : {}),
        }));
        const chapter = (index, start, end) => ({
            id: `ch_${String(index).padStart(3, '0')}`,
            summary: `<user>与林许完成第 ${start}–${end} 轮的阶段剧情，双方的目标和关系继续变化。`,
            keywords: ['伯滔', '林许', `第${index}章`],
            key_events: [{ floor_range: [start, end], text: `<user>推进本阶段剧情，林许作出回应。` }],
            coverage: Array.from({ length: end - start + 1 }, (_, offset) => ({ floor: start + offset, event_index: 0 })),
            floor_range: [start, end], pinned: false, demoted: false, stale: false, frozen: true, volume_id: null,
        });
        const memoryData = {
            version: 4,
            state_table: { version: 18, entries, changelog: [] },
            floor_events: [{
                floorKey: '124-u+124-a', pairIndex: 124, contentFingerprint: 'fp-124', recordedAt: 124,
                entryChanges: [
                    { op: 'upsert', after: { id: 'e_2', slot: 'promise', subject: '周衡', object: '林晚', value: '答应护送林晚到北港', evidence: '我会把你送到北港。', source: 'auto' } },
                    { op: 'upsert', after: { id: 'e_2', slot: 'promise', subject: '周衡', object: '林晚', value: '答应替林晚保管航海日志', evidence: '日志先放在我这里。', source: 'auto' } },
                ],
            }],
            turn_summaries: turnSummaries,
            chapters: [
                chapter(1, 0, 24), chapter(2, 25, 49), chapter(3, 50, 74), chapter(4, 75, 99),
                { ...chapter(5, 100, 124), ...(harnessMode === 'target' ? { stale: true, stale_reason: 'turn_summary_edit' } : {}), summary: '伯滔说明自己不喜欢熟鱼、偏好贝类和刺身，林许据此调整居酒屋的用餐安排。两人在交谈中继续确认彼此的边界，伯滔明确要求林许不要采取极端手段；林许接受要求，并承诺之后先沟通再行动。随着身份和动机逐步坦白，双方从互相试探转向有限信任，同时约定完成北港旧灯塔的调查后再讨论下一步安排。', keywords: ['伯滔', '林许', '居酒屋', '饮食偏好'], key_events: [{ floor_range: [100, 108], text: '伯滔说明饮食偏好，林许调整居酒屋安排。' }, { floor_range: [109, 117], text: '双方讨论行动边界，伯滔要求林许不要走极端。' }, { floor_range: [118, 124], text: '关系继续推进，并确认调查后的后续安排。' }] },
            ],
            volumes: [], keyword_index: {},
            review_queue: [{ id: 'r1', kind: 'flag_conflict', entry_id: 'e_3', note: '新楼层暗示两人已经和解，但旧事实仍为“尚未完全和解”。', createdAt: now }],
            notices: [{ id: 'n1', kind: 'notice', note: '旧聊天安全重建完成：已核对 132 / 132 轮。', createdAt: now }],
            quarantined_entries: [{ id: 'bad1', slot: 'world', subject: '', value: 'undefined', quarantineReason: '缺少明确主体；缺少事实内容' }],
            history_rebuild: harnessMode === 'review'
                ? { status: 'review', stage_mode: 'turns', total: 132, completed: 132, phase: '对话记录已经生成，等待检查和修改', turn_summaries: structuredClone(turnSummaries), entries: [], fact_events: [], chapters: [], extracted_keys: [], warnings: [], unresolved_floors: [], startedAt: now - 100000 }
                : harnessMode === 'empty-draft'
                    ? { status: 'stopped', stage_mode: 'turns', total: 132, completed: 0, phase: '对话记录重建已暂停', turn_summaries: [], entries: [], fact_events: [], chapters: [], extracted_keys: [], warnings: [], unresolved_floors: [], startedAt: now - 100000 }
                : harnessMode === 'chapter_error'
                    ? { status: 'error', stage_mode: 'chapters', total: 132, completed: 132, phase: '正在合并第 50–74 轮剧情', error: '章节生成失败，可继续处理', turn_summaries: structuredClone(turnSummaries), entries: [], fact_events: [], chapters: [chapter(1, 0, 24), chapter(2, 25, 49)], extracted_keys: [], warnings: [], unresolved_floors: [], startedAt: now - 100000 }
                    : { status: 'complete', stage_mode: 'chapters', total: 132, completed: 132, phase: '安全重建完成', warnings: ['第 31 轮已忽略一条不可靠事实'], startedAt: now - 100000, finishedAt: now },
            rebuild_backup: { createdAt: now - 100000 },
            pending_floors: [], extracted_keys: extracted,
            job_queue: {
                scope_id: 'harness-chat', paused: false,
                queued: [],
                running: harnessMode === 'running'
                    ? [{ id: 'running-extract', type: 'extract', payload: { pairIndex: 131 }, attempt: 1, maxAttempts: 3 }]
                    : [],
                failed: harnessMode === 'chapter_error'
                    ? [{ id: 'failed-chapter', type: 'history_rebuild_chapter', payload: { startPair: 50, endPair: 74 }, attempt: 1, maxAttempts: 3, lastError: '章节生成失败，可继续处理' }]
                    : [],
            },
            history_backfill: { status: 'complete', total: 132, completed: 132, startedAt: now - 100000, finishedAt: now },
            progress: { last_chapter_end_pair: 124, pairs_since_proofread: 2, next_entry_seq: 6, next_chapter_seq: 6, baseline_pair: 131 },
            logs: [{ t: now - 50000, level: 'info', message: '提取完成 楼#126: +1 丢0 冲突0' }],
        };
        const context = {
            chat,
            name1: '伯滔',
            name2: '北港旧灯塔 · 长档测试',
            characterId: 0,
            characters: [{ name: '北港旧灯塔' }],
            extensionSettings: { layered_memory: { enabled: true, memoryModelSource: 'profile', connectionProfile: 'writer-small', profileModelOverride: '', directBaseUrl: '', directApiKey: '', directModel: '', fallbackEnabled: false, fallbackBaseUrl: '', fallbackApiKey: '', fallbackModel: '', budgetL1: 2000, budgetL2: 5000, budgetL4: 1500, chapterSize: 25, proofreadEvery: 75, depthL1: 100, depthL2: 100, depthL4: 4, volumeCompressConfirm: false, l4Enabled: false, mentionStatMode: 'summary_and_table', chapterInputTokenCap: 20000, migrationReviewMode: false, eval_cases: [] } },
            chatMetadata: { layered_memory: memoryData },
            getConnectionProfiles: () => [{ id: 'writer-small', name: '记忆副模型', model: 'deepseek-v4-flash' }],
            generateRaw: async () => '{"ok":true}',
            saveSettingsDebounced: () => {},
            saveMetadata: async () => {},
            saveChat: async () => {},
            setExtensionPrompt: () => {},
        };
        window.SillyTavern = { getContext: () => context, libs: {} };
        window.toastr = { info: console.log, error: console.error, success: console.log };
        const { getPairs } = await import('../src/ids.js');
        const actualPairs = getPairs().filter(pair => pair.sealed);
        for (const summary of turnSummaries) {
            const pair = actualPairs[summary.pairIndex];
            summary.floorKey = pair.floorKey;
            summary.contentFingerprint = pair.contentFingerprint;
        }
        for (const event of memoryData.floor_events) {
            const pair = actualPairs[event.pairIndex];
            event.floorKey = pair.floorKey;
            event.contentFingerprint = pair.contentFingerprint;
        }
        const { injectPanel, openMemoryCenter } = await import('../src/ui/panel.js');
        injectPanel();
        openMemoryCenter(true);
    </script>
</body>
</html>
